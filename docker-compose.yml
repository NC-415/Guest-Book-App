version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: guestbook

  backend:
    build: ./backend
    container_name: backend_container
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - MYSQL_USER=nc415
      - MYSQL_PASSWORD=Eng@ruh415
      - MYSQL_HOST=az415-dev.mysql.database.azure.com
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=guestbook_app
    command: npm run dev

  frontend:
    build: ./frontend
    container_name: frontend_container
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    environment:
      - REACT_APP_BACKEND_URL=http://backend:5000

volumes:
  mysql_data:
